<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Auslieferungen im 3. Quartal 2026: Veränderung gegenüber dem Vorjahr</title>
  <desc id="d">Rückgang gesamt und in China. VW-Konzern gesamt minus 14,3 Prozent, China minus 38,5 Prozent. Mercedes-Benz Cars gesamt minus 8 Prozent, China minus 31 Prozent. BMW Group gesamt minus 6,3 Prozent, China minus 24,8 Prozent.</desc>
  <rect width="720" height="364" rx="8" fill="#1A1A1A"/>
  <text x="24" y="36" fill="#FFFFFF" font-size="18" font-weight="700">Der Einbruch kommt aus China</text>
  <text x="24" y="58" fill="#9E9E9E" font-size="13">Auslieferungen Q3 2026, Veränderung gegenüber Q3 2025</text>
  <rect x="510" y="26" width="14" height="14" rx="3" fill="#0097A7"/>
  <text x="530" y="38" fill="#E0E0E0" font-size="13">Gesamt</text>
  <rect x="600" y="26" width="14" height="14" rx="3" fill="#FF1744"/>
  <text x="620" y="38" fill="#E0E0E0" font-size="13">China</text>
  <line x1="200" y1="84" x2="200" y2="292" stroke="#2A2A2A" stroke-width="1"/>
  <text x="200" y="312" fill="#9E9E9E" font-size="12" text-anchor="middle">0 %</text>
  <line x1="310" y1="84" x2="310" y2="292" stroke="#2A2A2A" stroke-width="1"/>
  <text x="310" y="312" fill="#9E9E9E" font-size="12" text-anchor="middle">−10 %</text>
  <line x1="420" y1="84" x2="420" y2="292" stroke="#2A2A2A" stroke-width="1"/>
  <text x="420" y="312" fill="#9E9E9E" font-size="12" text-anchor="middle">−20 %</text>
  <line x1="530" y1="84" x2="530" y2="292" stroke="#2A2A2A" stroke-width="1"/>
  <text x="530" y="312" fill="#9E9E9E" font-size="12" text-anchor="middle">−30 %</text>
  <line x1="640" y1="84" x2="640" y2="292" stroke="#2A2A2A" stroke-width="1"/>
  <text x="640" y="312" fill="#9E9E9E" font-size="12" text-anchor="middle">−40 %</text>
  <text x="186" y="120" fill="#E0E0E0" font-size="15" text-anchor="end">VW-Konzern</text>
  <path d="M200,92 h153.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-153.3 z" fill="#0097A7"><title>VW-Konzern gesamt: −14,3 %</title></path>
  <text x="365.3" y="108" fill="#E0E0E0" font-size="14" font-weight="600">−14,3 %</text>
  <path d="M200,116 h419.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-419.5 z" fill="#FF1744"><title>VW-Konzern China: −38,5 %</title></path>
  <text x="631.5" y="132" fill="#E0E0E0" font-size="14" font-weight="600">−38,5 %</text>
  <text x="186" y="192" fill="#E0E0E0" font-size="15" text-anchor="end">Mercedes-Benz Cars¹</text>
  <path d="M200,164 h84 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-84 z" fill="#0097A7"><title>Mercedes-Benz Cars gesamt: −8,0 %</title></path>
  <text x="296" y="180" fill="#E0E0E0" font-size="14" font-weight="600">−8,0 %</text>
  <path d="M200,188 h337 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-337 z" fill="#FF1744"><title>Mercedes-Benz Cars China: −31,0 %</title></path>
  <text x="549" y="204" fill="#E0E0E0" font-size="14" font-weight="600">−31,0 %</text>
  <text x="186" y="264" fill="#E0E0E0" font-size="15" text-anchor="end">BMW Group</text>
  <path d="M200,236 h65.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-65.3 z" fill="#0097A7"><title>BMW Group gesamt: −6,3 %</title></path>
  <text x="277.3" y="252" fill="#E0E0E0" font-size="14" font-weight="600">−6,3 %</text>
  <path d="M200,260 h268.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-268.8 z" fill="#FF1744"><title>BMW Group China: −24,8 %</title></path>
  <text x="480.8" y="276" fill="#E0E0E0" font-size="14" font-weight="600">−24,8 %</text>
  
  <text x="24" y="346" fill="#9E9E9E" font-size="11">¹ Mercedes-Benz: nur Pkw. Quellen: Volkswagen Group, BMW Group, Mercedes-Benz (Oktober 2026).</text>
